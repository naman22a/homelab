---
- name: Check Argo CD deployments
  ansible.builtin.command:
      cmd: kubectl get deployments -n {{ argocd_namespace }}
  register: argocd_deployments
  changed_when: false

- name: Show Argo CD deployments
  ansible.builtin.debug:
      var: argocd_deployments.stdout_lines

- name: Check Argo CD server service
  ansible.builtin.command:
      cmd: kubectl get service argocd-server -n {{ argocd_namespace }}
  register: argocd_service
  changed_when: false

- name: Show Argo CD server service
  ansible.builtin.debug:
      var: argocd_service.stdout_lines

- name: Configure ArgoCD server for Traefik TLS termination
  become: false
  ansible.builtin.command:
      cmd: >-
          kubectl patch configmap argocd-cmd-params-cm
          -n argocd
          --type merge
          -p '{"data":{"server.insecure":"true"}}'
  environment:
      KUBECONFIG: '/home/{{ ansible_user }}/.kube/config'
  register: argocd_config
  changed_when: true

- name: Restart ArgoCD server
  become: false
  ansible.builtin.command:
      cmd: kubectl rollout restart deployment/argocd-server -n argocd
  environment:
      KUBECONFIG: '/home/{{ ansible_user }}/.kube/config'
  when: argocd_config.changed

- name: Wait for ArgoCD server
  become: false
  ansible.builtin.command:
      cmd: >-
          kubectl rollout status deployment/argocd-server
          -n argocd
          --timeout=300s
  environment:
      KUBECONFIG: '/home/{{ ansible_user }}/.kube/config'
  changed_when: false

- name: Create ArgoCD IngressRoute manifest
  become: false
  ansible.builtin.template:
      src: argocd-ingressroute.yml.j2
      dest: /tmp/argocd-ingressroute.yml
      mode: '0644'

- name: Apply ArgoCD IngressRoute
  become: false
  ansible.builtin.command:
      cmd: kubectl apply -f /tmp/argocd-ingressroute.yml
  environment:
      KUBECONFIG: '/home/{{ ansible_user }}/.kube/config'
  register: argocd_ingress
  changed_when: >-
      'created' in argocd_ingress.stdout or
      'configured' in argocd_ingress.stdout
