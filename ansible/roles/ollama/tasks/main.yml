---
- name: Install required packages
  ansible.builtin.apt:
      name:
          - curl
          - ca-certificates
          - ufw
      state: present
      update_cache: true

- name: Check if Ollama is installed
  ansible.builtin.command:
      cmd: which ollama
  register: ollama_installed
  changed_when: false
  failed_when: false

- name: Install Ollama
  ansible.builtin.shell:
      cmd: curl -fsSL https://ollama.com/install.sh | sh
      executable: /bin/bash
  when: ollama_installed.rc != 0

- name: Create Ollama models directory
  ansible.builtin.file:
      path: '{{ ollama_models_dir }}'
      state: directory
      owner: ollama
      group: ollama
      mode: '0755'

- name: Create systemd override directory
  ansible.builtin.file:
      path: /etc/systemd/system/ollama.service.d
      state: directory
      mode: '0755'

- name: Configure Ollama environment
  ansible.builtin.template:
      src: ollama.conf.j2
      dest: /etc/systemd/system/ollama.service.d/override.conf
      mode: '0644'
  notify:
      - Reload systemd
      - Restart Ollama

- name: Enable and start Ollama
  ansible.builtin.systemd:
      name: ollama
      enabled: true
      state: started
      daemon_reload: true

- name: Wait for Ollama API
  ansible.builtin.uri:
      url: http://127.0.0.1:11434/api/tags
      method: GET
      status_code: 200
  register: ollama_api
  retries: 12
  delay: 5
  until: ollama_api.status == 200

- name: Check installed Ollama models
  ansible.builtin.command:
      cmd: ollama list
  register: ollama_models
  changed_when: false

- name: Pull Ollama model
  ansible.builtin.command:
      cmd: 'ollama pull {{ ollama_model }}'
  environment:
      OLLAMA_MODELS: '{{ ollama_models_dir }}'
  when: ollama_model not in ollama_models.stdout

- name: Allow SSH
  community.general.ufw:
      rule: allow
      port: '22'
      proto: tcp

- name: Allow Ollama API from LAN
  community.general.ufw:
      rule: allow
      from_ip: '{{ ollama_allowed_network }}'
      to_port: '11434'
      proto: tcp

- name: Enable firewall
  community.general.ufw:
      state: enabled
      policy: deny
      direction: incoming
