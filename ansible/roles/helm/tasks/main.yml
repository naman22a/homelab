---
- name: Check if Helm is already installed
  ansible.builtin.command:
      cmd: helm version --short
  register: helm_installed
  failed_when: false
  changed_when: false

- name: Download Helm
  ansible.builtin.get_url:
      url: 'https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz'
      dest: '/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz'
      mode: '0644'
  when: helm_installed.rc != 0

- name: Extract Helm
  ansible.builtin.unarchive:
      src: '/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz'
      dest: '/tmp'
      remote_src: true
  when: helm_installed.rc != 0

- name: Install Helm binary
  ansible.builtin.copy:
      src: '/tmp/linux-{{ helm_arch }}/helm'
      dest: '{{ helm_install_dir }}/helm'
      mode: '0755'
      remote_src: true
  become: true
  when: helm_installed.rc != 0

- name: Verify Helm installation
  ansible.builtin.command:
      cmd: helm version --short
  register: helm_version_output
  changed_when: false

- name: Show Helm version
  ansible.builtin.debug:
      msg: '{{ helm_version_output.stdout }}'
