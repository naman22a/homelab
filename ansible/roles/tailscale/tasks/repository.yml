---
- name: Install Tailscale repository prerequisites
  ansible.builtin.apt:
      name:
          - ca-certificates
      state: present
      update_cache: true

- name: Add Tailscale GPG key
  ansible.builtin.get_url:
      url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
      dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
      owner: root
      group: root
      mode: '0644'

- name: Configure Tailscale APT repository
  ansible.builtin.deb822_repository:
      name: tailscale
      types:
          - deb
      uris:
          - https://pkgs.tailscale.com/stable/ubuntu
      suites:
          - "{{ ansible_facts['distribution_release'] }}"
      components:
          - main
      architectures:
          - amd64
      signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
      state: present

- name: Update APT cache
  ansible.builtin.apt:
      update_cache: true
