name: Secrets Scan

on:
    workflow_dispatch:
    push:
        branches: ['master']
        paths-ignore:
            - 'README.md'
            - 'LICENSE'
            - 'assets/**/*.*'

jobs:
    secrets-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
