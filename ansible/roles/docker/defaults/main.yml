---
# defaults file for roles/docker
docker_packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

docker_users:
    - '{{ ansible_user }}'

docker_service_enabled: true
docker_service_started: true

docker_daemon_config:
    log-driver: json-file
    log-opts:
        max-size: '10m'
        max-file: '3'
